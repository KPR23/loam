name: iOS

on:
  pull_request:
    branches: [main, "release/**"]
    # Only these paths feed the app build, so other changes skip the macOS job.
    paths:
      - Loam/**
      - LoamTests/**
      - LoamUITests/**
      - Loam.xcodeproj/**
      - project.yml
      - .github/workflows/ios.yml
  # Release branches test again, since a cherry-picked fix lands there without a PR.
  # main does too: a pull request can only restore caches saved on the base branch, so these
  # runs are what give every PR a warm Swift package cache.
  push:
    branches: [main, "release/**"]
    paths:
      - Loam/**
      - LoamTests/**
      - LoamUITests/**
      - Loam.xcodeproj/**
      - project.yml
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  # A group keeps one running and one pending run and drops older pending ones, so every push gets
  # its own group to make sure each merge is tested.
  group: ios-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every PR touching the app builds and tests it, so a broken build or test never reaches an rc tag.
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    # GitHub-hosted runners need about 9 minutes to build and 6 to test, so 15 cut runs off mid-test.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      # Package checkouts are the slow, network-bound part of a cold run. Package.resolved pins
      # them, so the cache only changes when a dependency does.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Loam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Loam -project Loam.xcodeproj -clonedSourcePackagesDirPath .spm

      # A fresh simulator per run keeps the test from reusing one that another process booted.
      - name: Create iOS simulator
        id: simulator
        run: |
          read -r DEVICE_TYPE RUNTIME <<< "$(
            python3 <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )

          preferred_names = [
              "iPhone 17",
              "iPhone 16",
              "iPhone 16e",
              "iPhone 17 Pro",
              "iPhone SE (3rd generation)",
          ]

          runtimes = sorted(
              runtime
              for runtime in data["devices"]
              if "iOS" in runtime or "SimRuntime.iOS" in runtime
          )

          for name in preferred_names:
              for runtime in reversed(runtimes):
                  for device in data["devices"][runtime]:
                      if device.get("isAvailable") and device["name"] == name:
                          print(device["deviceTypeIdentifier"], runtime)
                          sys.exit(0)

          for runtime in reversed(runtimes):
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["deviceTypeIdentifier"], runtime)
                      sys.exit(0)

          sys.exit("No suitable iPhone simulator found on runner")
          PY
          )"
          DEVICE_ID="$(xcrun simctl create "Loam CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$DEVICE_TYPE" "$RUNTIME")"
          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"
          # Booting takes minutes on a cold runner, so it runs while the app builds.
          xcrun simctl boot "$DEVICE_ID"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Loam.xcodeproj \
            -scheme Loam \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Wait for the simulator
        # Launching tests into a half-booted simulator fails with "server died".
        run: |
          xcrun simctl bootstatus "${{ steps.simulator.outputs.device_id }}" -b
          xcrun simctl list devices | grep "${{ steps.simulator.outputs.device_id }}"

      - name: Test
        # A failed test launch otherwise waits 10 minutes for simulator diagnostics.
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Loam.xcodeproj \
            -scheme Loam \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/Loam.xcresult"

      # Diagnostics are off, so the result bundle is what shows why a CI-only failure happened.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Loam.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Delete iOS simulator
        if: always() && steps.simulator.outputs.device_id != ''
        run: |
          xcrun simctl shutdown "${{ steps.simulator.outputs.device_id }}" || true
          xcrun simctl delete "${{ steps.simulator.outputs.device_id }}"

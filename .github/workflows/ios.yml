name: iOS

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, labeled]
    # Only these paths feed the app build, so other changes skip the macOS job.
    paths:
      - Loam/**
      - LoamTests/**
      - LoamUITests/**
      - Loam.xcodeproj/**
      - project.yml
      - .github/workflows/ios.yml
  # Release branches get the full tests, so an unlabeled PR can't reach an rc tag untested.
  # main doesn't: PRs touching the app already build, and tests run when labeled.
  push:
    branches: ["release/**"]
    paths:
      - Loam/**
      - LoamTests/**
      - LoamUITests/**
      - Loam.xcodeproj/**
      - project.yml
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  # A group keeps one running and one pending run and drops older pending ones, so every push gets
  # its own group to make sure each merge is tested.
  group: ios-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A compile check on every PR, so a broken build shows up before an rc tag reaches Xcode Cloud.
  # The test job builds too, so a labeled PR skips this job instead of compiling twice.
  build:
    name: Build
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'Run Build & Test')
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Package checkouts are the slow, network-bound part of a cold run. Package.resolved pins
      # them, so the cache only changes when a dependency does.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Loam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Loam.xcodeproj \
            -scheme Loam \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation

  # Tests stay behind the label on a PR to save macOS minutes; release branch pushes run them.
  build-and-test:
    name: Build & Test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'Run Build & Test')
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Xcode version
        run: xcodebuild -version

      # Package checkouts are the slow, network-bound part of a cold run. Package.resolved pins
      # them, so the cache only changes when a dependency does.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Loam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Loam -project Loam.xcodeproj -clonedSourcePackagesDirPath .spm

      # A self-hosted Mac shares its simulators with local work. A fresh simulator per run
      # keeps other sessions from rebooting or reusing it mid-test.
      - name: Create iOS simulator
        id: simulator
        run: |
          read -r DEVICE_TYPE RUNTIME <<< "$(
            python3 <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )

          preferred_names = [
              "iPhone 17",
              "iPhone 16",
              "iPhone 16e",
              "iPhone 17 Pro",
              "iPhone SE (3rd generation)",
          ]

          runtimes = sorted(
              runtime
              for runtime in data["devices"]
              if "iOS" in runtime or "SimRuntime.iOS" in runtime
          )

          for name in preferred_names:
              for runtime in reversed(runtimes):
                  for device in data["devices"][runtime]:
                      if device.get("isAvailable") and device["name"] == name:
                          print(device["deviceTypeIdentifier"], runtime)
                          sys.exit(0)

          for runtime in reversed(runtimes):
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["deviceTypeIdentifier"], runtime)
                      sys.exit(0)

          sys.exit("No suitable iPhone simulator found on runner")
          PY
          )"
          DEVICE_ID="$(xcrun simctl create "Loam CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$DEVICE_TYPE" "$RUNTIME")"
          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"
          # Launching tests into a half-booted simulator fails with "server died".
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl list devices | grep "${DEVICE_ID}"

      - name: Build and test
        # A failed test launch otherwise waits 10 minutes for simulator diagnostics.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Loam.xcodeproj \
            -scheme Loam \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/Loam.xcresult"

      # Diagnostics are off, so the result bundle is what shows why a CI-only failure happened.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Loam.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Delete iOS simulator
        if: always() && steps.simulator.outputs.device_id != ''
        run: |
          xcrun simctl shutdown "${{ steps.simulator.outputs.device_id }}" || true
          xcrun simctl delete "${{ steps.simulator.outputs.device_id }}"

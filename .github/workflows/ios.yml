name: iOS

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Loam -project Loam.xcodeproj

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Loam.xcodeproj \
            -scheme Loam \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation

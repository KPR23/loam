name: iOS

on:
  pull_request:
    branches: [dev, main]
    # Only these paths feed the app build, so other changes skip the macOS job.
    paths:
      - Loam/**
      - LoamTests/**
      - LoamUITests/**
      - Loam.xcodeproj/**
      - project.yml
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Loam -project Loam.xcodeproj

      # A self-hosted Mac shares its simulators with local work. A fresh simulator per run
      # keeps other sessions from rebooting or reusing it mid-test.
      - name: Create iOS simulator
        id: simulator
        run: |
          read -r DEVICE_TYPE RUNTIME <<< "$(
            python3 <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )

          preferred_names = [
              "iPhone 17",
              "iPhone 16",
              "iPhone 16e",
              "iPhone 17 Pro",
              "iPhone SE (3rd generation)",
          ]

          runtimes = sorted(
              runtime
              for runtime in data["devices"]
              if "iOS" in runtime or "SimRuntime.iOS" in runtime
          )

          for name in preferred_names:
              for runtime in reversed(runtimes):
                  for device in data["devices"][runtime]:
                      if device.get("isAvailable") and device["name"] == name:
                          print(device["deviceTypeIdentifier"], runtime)
                          sys.exit(0)

          for runtime in reversed(runtimes):
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["deviceTypeIdentifier"], runtime)
                      sys.exit(0)

          sys.exit("No suitable iPhone simulator found on runner")
          PY
          )"
          DEVICE_ID="$(xcrun simctl create "Loam CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$DEVICE_TYPE" "$RUNTIME")"
          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"
          # Launching tests into a half-booted simulator fails with "server died".
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl list devices | grep "${DEVICE_ID}"

      - name: Build and test
        # A failed test launch otherwise waits 10 minutes for simulator diagnostics.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Loam.xcodeproj \
            -scheme Loam \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -collect-test-diagnostics never

      - name: Delete iOS simulator
        if: always() && steps.simulator.outputs.device_id != ''
        run: |
          xcrun simctl shutdown "${{ steps.simulator.outputs.device_id }}" || true
          xcrun simctl delete "${{ steps.simulator.outputs.device_id }}"

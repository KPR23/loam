name: Supabase migrations

on:
  push:
    branches: [main, "release/**"]
  # Deploy jobs are gated on the branch name, so pull requests only verify.
  pull_request:
    branches: [main, "release/**"]
    # Only these paths feed the backend, so iOS-only changes skip the Docker stack.
    paths:
      - supabase/**
      - .github/workflows/supabase.yml
      - .github/actions/setup-supabase/**

permissions:
  contents: read

concurrency:
  # Every release branch deploys to production, so they share one queue.
  group: supabase-${{ startsWith(github.ref_name, 'release/') && 'production' || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Supabase keys migrations by the timestamp prefix alone, so two files sharing one fail
  # `db push` with a duplicate key even when their names differ. This fails in seconds,
  # before the Docker stack starts.
  check-migration-versions:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject duplicate versions
        run: |
          dups="$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)"
          [ -z "$dups" ] || { echo "Duplicate migration versions: $dups. Rename one with 'supabase migration new'." >&2; exit 1; }
      - name: Reject migrations older than the base branch's latest
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          latest="$(git ls-tree --name-only "$base" supabase/migrations/ | xargs -n1 basename | cut -d_ -f1 | sort | tail -1)"
          git diff --diff-filter=A --name-only "$base"...HEAD -- supabase/migrations | while read -r file; do
            version="$(basename "$file" | cut -d_ -f1)"
            if [[ "$version" < "$latest" || "$version" == "$latest" ]]; then
              echo "$file is not newer than $latest on ${{ github.base_ref }}. Rebase and rename it with 'supabase migration new'." >&2
              exit 1
            fi
          done

  verify-database:
    needs: check-migration-versions
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # A normal run takes about 5 minutes; a hung install shouldn't burn half an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-supabase
      - name: Pin the Postgres image
        # v2.99.0 defaults to 17.6.1.107, which segfaults when a role calls a function it can't execute.
        run: mkdir -p supabase/.temp && printf 17.6.1.166 > supabase/.temp/postgres-version
      - name: Replay migrations on a clean database
        # The self-hosted runner is too slow for storage to pass the CLI's health-check window,
        # so it skips services the database tests never touch.
        run: >-
          supabase start ${{ runner.environment == 'self-hosted'
          && '--ignore-health-check -x studio,logflare,vector,imgproxy,mailpit,edge-runtime,realtime,postgres-meta'
          || '' }}
      - name: Verify authorization and financial invariants
        run: supabase test db
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup

  test-functions:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Lint edge functions
        run: deno lint supabase/functions
      - name: Test edge functions
        run: deno test supabase/functions

  # main deploys staging. A release branch deploys production before its App Store build
  # goes to review, so the reviewed build already talks to the migrated backend.
  deploy:
    needs: [verify-database, test-functions]
    if: github.event_name == 'push'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'staging' || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Each environment holds only its own password, so exactly one of these is set.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD || secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DELETION_WORKER_KEY: ${{ secrets.DELETION_WORKER_KEY }}
      DELETION_MONITOR_KEY: ${{ secrets.DELETION_MONITOR_KEY }}
      DELETION_NOTIFIER_KEY: ${{ secrets.DELETION_NOTIFIER_KEY }}
      DELETION_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.DELETION_CREDENTIAL_ENCRYPTION_KEY }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
      REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
      # Push notifications stay off until PUSH_NOTIFICATION_KEY is set; then the APNs values are required too.
      PUSH_NOTIFICATION_KEY: ${{ secrets.PUSH_NOTIFICATION_KEY }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID || 'app.loam.Loam' }}
      # Only App Store builds send analytics, so staging sets this variable to false and keeps no
      # credential that can delete PostHog data.
      ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'true' }}
      # Set per environment, so moving to a new Supabase project is a settings change.
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-supabase
      # The app's xcconfig is the other source of the project ref. A mismatch would migrate one
      # project while the build ships against another.
      - name: Check the project ref matches the app
        env:
          XCCONFIG: Loam/Config/${{ github.ref_name == 'main' && 'Staging' || 'Production' }}.xcconfig
        run: |
          test -n "$PROJECT_REF" || { echo "Set the SUPABASE_PROJECT_REF variable on this environment." >&2; exit 1; }
          grep '^SUPABASE_URL' "$XCCONFIG" | grep -Fq "/$PROJECT_REF.supabase.co" || {
            echo "SUPABASE_PROJECT_REF ($PROJECT_REF) does not match SUPABASE_URL in $XCCONFIG." >&2
            exit 1
          }
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Validate and install function secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_SERVICE_ROLE_KEY DELETION_WORKER_KEY DELETION_NOTIFIER_KEY DELETION_MONITOR_KEY DELETION_CREDENTIAL_ENCRYPTION_KEY APPLE_CLIENT_ID APPLE_CLIENT_SECRET REVENUECAT_SECRET_API_KEY REVENUECAT_WEBHOOK_AUTH)
          if [[ $ANALYTICS_ENABLED == true ]]; then required+=(POSTHOG_PROJECT_ID POSTHOG_PERSONAL_API_KEY); fi
          if [[ -n $PUSH_NOTIFICATION_KEY ]]; then required+=(APNS_KEY_P8 APNS_KEY_ID APNS_TEAM_ID); fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required GitHub environment secret: $name" >&2; exit 1; fi
          done
          # Apple caps the client secret at six months, and once it lapses account deletion can't revoke
          # Sign in with Apple. Renewal is in docs/account-deletion-runbook.md.
          claims="$(cut -d . -f 2 <<< "$APPLE_CLIENT_SECRET" | tr '_-' '/+')"
          while (( ${#claims} % 4 )); do claims+="="; done
          expires_at="$(base64 -d <<< "$claims" 2>/dev/null | jq -r '.exp // empty' 2>/dev/null || true)"
          [[ $expires_at =~ ^[0-9]+$ ]] || { echo "APPLE_CLIENT_SECRET is not a readable JWT." >&2; exit 1; }
          days_left=$(( (expires_at - $(date +%s)) / 86400 ))
          if (( days_left < 7 )); then
            echo "APPLE_CLIENT_SECRET expires in $days_left days. Renew it as docs/account-deletion-runbook.md describes." >&2
            exit 1
          elif (( days_left < 30 )); then
            echo "::warning::APPLE_CLIENT_SECRET expires in $days_left days. Renew it as docs/account-deletion-runbook.md describes."
          fi
          secret_file="$RUNNER_TEMP/loam-function-secrets"
          umask 077
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\nDELETION_WORKER_KEY=%s\nDELETION_NOTIFIER_KEY=%s\nDELETION_MONITOR_KEY=%s\nDELETION_CREDENTIAL_ENCRYPTION_KEY=%s\nAPPLE_CLIENT_ID=%s\nAPPLE_CLIENT_SECRET=%s\nDELETION_EMAIL_ENABLED=false\nANALYTICS_ENABLED=%s\nREVENUECAT_SECRET_API_KEY=%s\nREVENUECAT_WEBHOOK_AUTH=%s\n' \
            "$SUPABASE_SERVICE_ROLE_KEY" "$DELETION_WORKER_KEY" "$DELETION_NOTIFIER_KEY" "$DELETION_MONITOR_KEY" "$DELETION_CREDENTIAL_ENCRYPTION_KEY" "$APPLE_CLIENT_ID" "$APPLE_CLIENT_SECRET" "$ANALYTICS_ENABLED" "$REVENUECAT_SECRET_API_KEY" "$REVENUECAT_WEBHOOK_AUTH" > "$secret_file"
          if [[ $ANALYTICS_ENABLED == true ]]; then
            printf 'POSTHOG_PROJECT_ID=%s\nPOSTHOG_PERSONAL_API_KEY=%s\n' "$POSTHOG_PROJECT_ID" "$POSTHOG_PERSONAL_API_KEY" >> "$secret_file"
          fi
          if [[ -n $PUSH_NOTIFICATION_KEY ]]; then
            # The .p8 is multi-line; env files take it as one escaped line.
            printf 'PUSH_NOTIFICATION_KEY=%s\nAPNS_KEY_ID=%s\nAPNS_TEAM_ID=%s\nAPNS_BUNDLE_ID=%s\nAPNS_KEY_P8=%s\n' \
              "$PUSH_NOTIFICATION_KEY" "$APNS_KEY_ID" "$APNS_TEAM_ID" "$APNS_BUNDLE_ID" "${APNS_KEY_P8//$'\n'/\\n}" >> "$secret_file"
          fi
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$secret_file"
          rm -f "$secret_file"
      # Secrets are checked first so a missing one stops the deploy before any migration runs.
      - name: Apply migrations
        run: supabase db push
      # Deploys every function under supabase/functions. Bundling through the API skips Docker,
      # which crashed with exit 135 on the self-hosted runner.
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
      # After the deploy, so the running worker already skips analytics deletion when they go.
      - name: Remove PostHog credentials where analytics are off
        if: env.ANALYTICS_ENABLED != 'true'
        run: |
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/secrets"
          stale="$(curl --fail --silent --show-error "$api" --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -c '[.[].name | select(startswith("POSTHOG_"))]')"
          if [ "$stale" != "[]" ]; then
            curl --fail --silent --show-error --output /dev/null --request DELETE "$api" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data "$stale"
          fi
      - name: Provision Vault and scheduler
        run: |
          body="$(jq -n --arg url "$PROJECT_URL" --arg worker "$DELETION_WORKER_KEY" --arg notifier "$DELETION_NOTIFIER_KEY" '{p_project_url:$url,p_worker_key:$worker,p_notifier_key:$notifier}')"
          curl --fail --silent --show-error --output /dev/null --request POST "$PROJECT_URL/rest/v1/rpc/configure_account_deletion_scheduler" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header 'Content-Type: application/json' --data "$body"
      - name: Provision push notifications
        if: env.PUSH_NOTIFICATION_KEY != ''
        run: |
          body="$(jq -n --arg url "$PROJECT_URL" --arg key "$PUSH_NOTIFICATION_KEY" '{p_project_url:$url,p_push_key:$key}')"
          curl --fail --silent --show-error --output /dev/null --request POST "$PROJECT_URL/rest/v1/rpc/configure_push_notifications" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header 'Content-Type: application/json' --data "$body"
      - name: Verify protected worker deployment
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST "$PROJECT_URL/functions/v1/account-deletion-worker" --header 'X-Deletion-Worker-Key: deployment-probe-invalid')"
          test "$status" = 401
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST "$PROJECT_URL/functions/v1/account-deletion-notifier" --header 'X-Deletion-Notifier-Key: deployment-probe-invalid')"
          test "$status" = 401
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request GET "$PROJECT_URL/functions/v1/account-deletion-monitor" --header 'X-Deletion-Monitor-Key: deployment-probe-invalid')"
          test "$status" = 401
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST "$PROJECT_URL/functions/v1/revenuecat-webhook" --header 'Authorization: deployment-probe-invalid')"
          test "$status" = 401
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST "$PROJECT_URL/functions/v1/send-push" --header 'X-Push-Key: deployment-probe-invalid')"
          # 503 while push is unconfigured; 401 once the key is installed.
          test "$status" = 401 || { test -z "$PUSH_NOTIFICATION_KEY" && test "$status" = 503; }

version: 2
updates:
  # Every action is pinned to a commit, so nothing moves until Dependabot proposes the new SHA.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-supabase
    schedule:
      interval: monthly
    ignore:
      # v3 installs the CLI through npm, and that install hangs on GitHub-hosted runners.
      - dependency-name: supabase/setup-cli
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]

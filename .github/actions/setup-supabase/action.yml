name: Set up Supabase CLI
description: Installs the pinned Supabase CLI on a GitHub-hosted runner, or verifies the self-hosted runner's copy and its rootless Docker.

runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
      # The self-hosted runner preinstalls the Go CLI: its CPU cannot run the Bun build.
      if: runner.environment == 'github-hosted'
      with:
        version: 2.99.0
    - name: Use the runner's Supabase CLI and rootless Docker
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        # Pins the preinstalled binary to supabase-go from the v2.99.0 release, like setup-cli does.
        # Compared manually (not `sha256sum -c`) since the runner's sha256sum doesn't support long flags.
        actual="$(sha256sum "$HOME/bin/supabase" | cut -d ' ' -f 1)"
        expected="2ae25b607c29d21444525ced42596529eca5b806e64d325a49655401a0220b50"
        if [ "$actual" != "$expected" ]; then
          echo "Checksum mismatch for $HOME/bin/supabase: expected $expected, got $actual" >&2
          exit 1
        fi
        echo "$HOME/bin" >> "$GITHUB_PATH"
        echo "DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock" >> "$GITHUB_ENV"

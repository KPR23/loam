name: Loam
options:
  bundleIdPrefix: app.loam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Loam
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Loam:
    type: application
    platform: iOS
    sources:
      - path: Loam
        excludes:
          - "**/*.md"
    resources:
      - path: Loam/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.Loam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Loam/Loam.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_SUPABASE_URL: "$(SUPABASE_URL)"
        INFOPLIST_KEY_SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
    dependencies:
      - package: supabase-swift
        product: Supabase
    entitlements:
      path: Loam/Loam.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
  LoamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoamTests
    dependencies:
      - target: Loam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.LoamTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Loam:
    build:
      targets:
        Loam: all
        LoamTests: [test]
    test:
      targets:
        - LoamTests
    run:
      config: Debug

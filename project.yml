name: Loam
options:
  bundleIdPrefix: app.loam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Loam
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: XXJA67J9AN
configs:
  Debug: debug
  Release: release
  TestFlight: release
  Production: release
configFiles:
  Debug: Loam/Config/Debug.xcconfig
  Release: Loam/Config/Release.xcconfig
  TestFlight: Loam/Config/Staging.xcconfig
  Production: Loam/Config/Production.xcconfig
packages:
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.24.0"
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Loam:
    type: application
    platform: iOS
    sources:
      - path: Loam
        excludes:
          - "**/*.md"
    resources:
      - path: Loam/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.Loam
        INFOPLIST_FILE: Loam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Loam/Loam.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: sentry-cocoa
        product: Sentry
      - package: supabase-swift
        product: Supabase
    entitlements:
      path: Loam/Loam.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
  LoamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoamTests
    dependencies:
      - target: Loam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.LoamTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Loam:
    build:
      targets:
        Loam: all
        LoamTests: [test]
    test:
      targets:
        - LoamTests
    run:
      config: Debug
    archive:
      config: Production
  Loam-TestFlight:
    build:
      targets:
        Loam: all
        LoamTests: [test]
    test:
      targets:
        - LoamTests
    archive:
      config: TestFlight

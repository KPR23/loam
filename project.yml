name: Loam
options:
  bundleIdPrefix: app.loam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Loam
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: XXJA67J9AN
configs:
  Debug: debug
  Release: release
  TestFlight: release
  Production: release
configFiles:
  Debug: Loam/Config/Debug.xcconfig
  Release: Loam/Config/Release.xcconfig
  TestFlight: Loam/Config/Staging.xcconfig
  Production: Loam/Config/Production.xcconfig
packages:
  posthog-ios:
    url: https://github.com/PostHog/posthog-ios
    from: "3.82.0"
  purchases-ios-spm:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.91.0"
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.24.0"
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Loam:
    type: application
    platform: iOS
    sources:
      - path: Loam
        excludes:
          - "**/*.md"
          # Local-only and gitignored; a reference would show as missing everywhere else.
          - "Config/Secrets.xcconfig"
    resources:
      - path: Loam/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.Loam
        INFOPLIST_FILE: Loam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Loam/Loam.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. XcodeGen's iOS preset sets "1,2" on each target, which outranks a
        # project-level value, so this has to live on the target.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Sentry upload script reads dSYMs outside the script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Upload Debug Symbols to Sentry
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
        script: |
          # Debug builds don't report to Sentry, and Xcode Cloud uploads from ci_scripts/ci_post_xcodebuild.sh.
          if [ "$CONFIGURATION" = "Debug" ] || [ -n "${CI:-}" ]; then
            exit 0
          fi
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=kprs-lab
            export SENTRY_PROJECT=apple-ios
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "warning: sentry-cli - $ERROR"
            fi
          else
            echo "warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
    dependencies:
      - package: posthog-ios
        product: PostHog
      - package: purchases-ios-spm
        product: RevenueCat
      - package: purchases-ios-spm
        product: RevenueCatUI
      - package: sentry-cocoa
        product: Sentry
      - package: supabase-swift
        product: Supabase
    entitlements:
      path: Loam/Loam.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Xcode swaps this for "production" when signing for TestFlight and the App Store.
        aps-environment: development
  LoamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoamTests
    dependencies:
      - target: Loam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.LoamTests
        GENERATE_INFOPLIST_FILE: YES
  LoamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoamUITests
    dependencies:
      - target: Loam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loam.LoamUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Loam
schemes:
  Loam:
    build:
      targets:
        Loam: all
        LoamTests: [test]
        LoamUITests: [test]
    test:
      targets:
        - LoamTests
        - LoamUITests
    run:
      config: Debug
    archive:
      config: Production
  Loam-TestFlight:
    build:
      targets:
        Loam: all
        LoamTests: [test]
        LoamUITests: [test]
    test:
      targets:
        - LoamTests
        - LoamUITests
    archive:
      config: TestFlight
